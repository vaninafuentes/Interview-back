# ===========================================================================
# application.properties — Configuración de la aplicación Spring Boot
# ===========================================================================
# Este archivo centraliza toda la configuración del backend.
# Spring Boot lo lee automáticamente al arrancar.

# --- Nombre de la aplicación ---
spring.application.name=interview-back

# ===========================================================================
# CONFIGURACIÓN DE BASE DE DATOS (MySQL)
# ===========================================================================

# URL de conexión JDBC:
#   - localhost:3307     → MySQL en Docker
#   - interviewai_db     → nombre de la base de datos
#   - createDatabaseIfNotExist=true → crea la DB si no existe (útil para dev)
#   - useSSL=false       → deshabilita SSL (solo para desarrollo local)
#   - serverTimezone=UTC → evita problemas de timezone con MySQL
#   - allowPublicKeyRetrieval=true → Requerido por MySQL 8 en Docker
spring.datasource.url=jdbc:mysql://localhost:3307/interviewai_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Credenciales de MySQL
# Contraseña del contenedor Docker: docker run ... -e MYSQL_ROOT_PASSWORD=root
spring.datasource.username=root
spring.datasource.password=root

# Driver JDBC de MySQL 8+
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===========================================================================

# ddl-auto=update: Hibernate actualiza el esquema de la DB automáticamente
# al arrancar, creando tablas nuevas y agregando columnas faltantes.
# NUNCA usar en producción (usar "validate" o "none" + migraciones Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update

# Muestra las queries SQL generadas por Hibernate en la consola.
# Útil para debugging; desactivar en producción.
spring.jpa.show-sql=true

# Dialecto de MySQL: le dice a Hibernate cómo generar SQL específico para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===========================================================================
# CONFIGURACIÓN JWT
# ===========================================================================

# Clave secreta para firmar tokens JWT con HS256.
# Se lee de la variable de entorno JWT_SECRET, con un valor por defecto SOLO para
# desarrollo local (si no está definida, la app arranca igual y no se rompe el clon).
# Debe tener al menos 32 caracteres (256 bits) para HS256.
#
# ⚠️  En producción: definir JWT_SECRET con un valor propio y secreto, nunca usar
#     el default de abajo.
# ⚠️  OJO AL CAMBIARLA: invalida TODOS los tokens ya emitidos — los usuarios van a
#     tener que volver a iniciar sesión.
jwt.secret=${JWT_SECRET:dev-only-interview-app-secret-change-me-0123456789}

# Tiempo de expiración del token: 7 días en milisegundos
# 7 * 24 * 60 * 60 * 1000 = 604800000
jwt.expiration-ms=604800000

# ===========================================================================
# CONFIGURACIÓN DE GROQ AI (groq.com)
# ===========================================================================
# Groq es una plataforma de inferencia rápida compatible con la API de OpenAI.
# Consola y API keys gratuitas en: https://console.groq.com
#
# La API key se lee de la variable de entorno GROQ_API_KEY.
# ⚠️  NUNCA hardcodees la API key en este archivo.
# ⚠️  Configurá la variable de entorno antes de correr el backend:
#
#   PowerShell (sesión actual):
#     $env:GROQ_API_KEY = "gsk_tu_api_key_aqui"
#
#   IntelliJ IDEA:
#     Run/Debug Configurations → Environment variables → GROQ_API_KEY=gsk_...
#
# Si GROQ_API_KEY no está definida, el servicio devuelve un feedback de fallback.
groq.api-key=${GROQ_API_KEY:NOT_CONFIGURED}

# Modelo de Groq a usar. Está acá (y no hardcodeado en el código) para poder
# cambiarlo sin recompilar: Groq retira modelos de su tier Preview cada tanto.
# Si el modelo configurado deja de existir, se cambia esta línea y listo.
groq.model=qwen/qwen3.8-27b

# ===========================================================================
# CONFIGURACIÓN DE SUBIDA DE ARCHIVOS (MULTIPART)
# ===========================================================================
# Límite para la subida del CV en PDF (POST /api/cv/analyze).
# max-file-size    → tamaño máximo de un archivo individual
# max-request-size → tamaño máximo total de la petición (varios archivos + campos)
#
# Si se supera el límite, Spring lanza MaxUploadSizeExceededException y
# GlobalExceptionHandler responde 400 (no 500).
# CvAnalysisService valida el mismo límite (10 MB) como segunda barrera.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
